<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10243a"><title>Где дешевле?</title><link rel="manifest" href="manifest.webmanifest"><style>body{margin:0;font:16px system-ui;background:#f3f6fa;color:#142235}header{background:#10243a;color:white;padding:24px max(18px,calc((100vw - 1100px)/2))}h1{margin:0 0 7px;font-size:30px}header p{margin:0;color:#cbd7e5}.wrap{max-width:1100px;margin:auto;padding:22px 16px}.panel{background:white;border-radius:16px;padding:16px;box-shadow:0 4px 20px #15243a10}.controls{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;border:1px solid #d6dfea;border-radius:10px;padding:12px}input{flex:2;min-width:180px}select{flex:1;min-width:145px}button{background:#1463e6;color:white;border:0;cursor:pointer}.hint{color:#596b7f;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:20px}.card{background:white;border-radius:16px;padding:20px;box-shadow:0 4px 20px #15243a10}.emoji{font-size:48px}.price{font-size:26px;font-weight:800;color:#11634b}.tag{font-size:12px;color:#71521d;background:#fff2cc;border-radius:6px;padding:5px 8px;display:inline-block}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.secondary{background:#eaf1fc;color:#184b93}a.action{display:inline-block;background:#1463e6;color:white;padding:12px;border-radius:10px;text-decoration:none}.muted{color:#617187}.empty{padding:30px;text-align:center}</style><meta name="mitgo-verification" content="63016124-aa1c-42c7-a268-55691b2b7d1d" /></head><body><header><h1>🛒 Где дешевле?</h1><p>Сравнивай предложения. Покупай осознанно.</p></header><main class="wrap"><section class="panel"><div class="controls"><input id="q" placeholder="Найти товар, например SSD" aria-label="Поиск"><select id="category" aria-label="Категория"><option value="">Все категории</option><option>Электроника</option><option>Для дома</option><option>Компьютеры</option></select><select id="sort" aria-label="Сортировка"><option value="default">По умолчанию</option><option value="asc">Сначала дешевле</option><option value="desc">Сначала дороже</option></select><button id="favorites" class="secondary">♡ Избранное</button></div><p class="hint"><strong>Демонстрационная версия.</strong> Цены ниже вымышленные, не являются актуальными предложениями магазинов. Реальные цены и ссылки подключим после проверки источников.</p></section><div class="row"><h2>Каталог</h2><span id="count" class="muted"></span></div><div id="grid" class="grid"></div></main><script>const items=[{id:1,name:"SSD 1 ТБ",category:"Компьютеры",price:4590,shop:"Магазин А",emoji:"💾"},{id:2,name:"Беспроводные наушники",category:"Электроника",price:1990,shop:"Магазин Б",emoji:"🎧"},{id:3,name:"Робот-пылесос",category:"Для дома",price:12990,shop:"Магазин В",emoji:"🤖"},{id:4,name:"Смартфон 128 ГБ",category:"Электроника",price:14990,shop:"Магазин А",emoji:"📱"},{id:5,name:"Клавиатура",category:"Компьютеры",price:1290,shop:"Магазин Б",emoji:"⌨️"},{id:6,name:"Электрочайник",category:"Для дома",price:2490,shop:"Магазин В",emoji:"🫖"}];let fav=new Set(JSON.parse(localStorage.getItem("favorites")||"[]")),onlyFav=false;const $=id=>document.getElementById(id);function render(){let data=items.filter(x=>(!$('q').value||x.name.toLowerCase().includes($('q').value.toLowerCase()))&&(!$('category').value||x.category===$('category').value)&&(!onlyFav||fav.has(x.id)));if($('sort').value==='asc')data.sort((a,b)=>a.price-b.price);if($('sort').value==='desc')data.sort((a,b)=>b.price-a.price);$('count').textContent=data.length+' товаров';$('grid').innerHTML=data.length?data.map(x=>'<article class="card"><div class="row"><span class="tag">Тестовые данные</span><button class="secondary" onclick="toggle('+x.id+')" aria-label="Добавить в избранное">'+(fav.has(x.id)?'♥':'♡')+'</button></div><div class="emoji">'+x.emoji+'</div><h3>'+x.name+'</h3><p class="muted">'+x.category+' · '+x.shop+'</p><div class="price">'+x.price.toLocaleString('ru-RU')+' ₽</div><p class="hint">Цена для демонстрации</p><button disabled style="opacity:.55;cursor:not-allowed">Ссылка появится после подключения</button></article>').join(''):'<div class="panel empty">Ничего не найдено. Попробуйте другой запрос.</div>'}function toggle(id){fav.has(id)?fav.delete(id):fav.add(id);localStorage.setItem('favorites',JSON.stringify([...fav]));render()}['q','category','sort'].forEach(id=>$(id).addEventListener('input',render));$('favorites').onclick=()=>{onlyFav=!onlyFav;$('favorites').textContent=onlyFav?'♥ Показать все':'♡ Избранное';render()};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
