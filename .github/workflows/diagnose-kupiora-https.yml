name: Diagnose kupiora.ru HTTPS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-kupiora-https.yml

permissions:
  contents: read
  pages: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check GitHub Pages config, DNS, and HTTPS (read only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "=== GitHub Pages settings ==="
          curl --max-time 15 -sS -f -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            | python3 -c 'import sys,json; a=json.load(sys.stdin); print(json.dumps({k:a.get(k) for k in ("cname","url","html_url","https_enforced","https_available","status","build_type")},ensure_ascii=False,indent=2))'
          echo "=== DNS kupiora.ru ==="
          for q in A AAAA CNAME CAA NS; do echo "DNS $q"; dig +time=5 +tries=1 +short kupiora.ru "$q"; done
          echo "DNS www CNAME"
          dig +time=5 +tries=1 +short www.kupiora.ru CNAME
          echo "=== HTTPS certificate ==="
          python3 - <<'PY'
          import socket,ssl
          host="kupiora.ru"
          try:
              context=ssl.create_default_context()
              with socket.create_connection((host,443),timeout=12) as s:
                  with context.wrap_socket(s,server_hostname=host) as tls:
                      cert=tls.getpeercert()
                      print("HTTPS OK",tls.version(),cert.get("notAfter"),cert.get("subject"))
          except Exception as e:
              print("HTTPS ERROR",type(e).__name__,str(e))
          PY
          echo "=== Redirects ==="
          for url in http://kupiora.ru/ https://kupiora.ru/; do
            echo "$url"
            curl -sS -L -I --max-time 15 -o /dev/null \
              -w "HTTP %{http_code}, final %{url_effective}, SSL verify %{ssl_verify_result}\n" "$url"
          done
          echo "=== End diagnostics ==="
