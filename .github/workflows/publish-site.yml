name: Publish Kupiora homepage
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kupiora-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish static frontend only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare public static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html compare-any.html results.html results.js results.css inline-results.css styles.css core.js app.js catalog-loader.js sw.js manifest.webmanifest _site/
          cp -R assets data _site/
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/compare-any.html
          test -s _site/results.html
          test -s _site/results.js
          test -s _site/inline-results.css
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
