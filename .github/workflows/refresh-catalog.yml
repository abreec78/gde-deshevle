name: Publish verification page only
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
jobs:
  verify-page:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 12922931831
          github-token: ${{ github.token }}
          path: previous
          merge-multiple: true
      - name: Preserve published site and add verification
        run: |
          mkdir site
          tar -xf previous/artifact.tar -C site
          printf '%s' '<!doctype html><html lang="ru"><meta charset="utf-8"><title>Yandex verification</title><body>kghfhs3afifawlfx</body></html>' > site/yandex-verification.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
