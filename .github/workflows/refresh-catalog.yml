name: Import authorized price feeds
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: price-feed-import
  cancel-in-progress: false
jobs:
  import:
    if: vars.REAL_INGESTION_ENABLED == 'true' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: work/catalog.sqlite
          key: price-history-v1-${{ github.run_id }}
          restore-keys: price-history-v1-
      - name: Validate importer
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Fetch feeds and build catalogue
        env:
          SOURCE_FEEDS_JSON: ${{ secrets.SOURCE_FEEDS_JSON }}
          FEED_AUTHORIZATION: ${{ secrets.FEED_AUTHORIZATION }}
        run: |
          test -n "$SOURCE_FEEDS_JSON" || { echo 'SOURCE_FEEDS_JSON is required'; exit 1; }
          python ingestion/import_feed.py
      - name: Save catalogue and history for review (no deployment)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: price-catalog-${{ github.run_id }}
          path: |
            data/catalog.json
            work/catalog.sqlite
          retention-days: 7
          if-no-files-found: error

      - name: Prepare public site
        run: |
          mkdir -p _site
          cp index.html app.js core.js catalog-loader.js styles.css sw.js manifest.webmanifest _site/
          cp -r assets data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish GitHub Pages
        uses: actions/deploy-pages@v4
