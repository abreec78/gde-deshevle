name: Browser smoke test
on:
  pull_request:
    paths:
      - 'compare-any.html'
      - 'results.html'
      - 'results.css'
      - 'results.js'
      - 'inline-results.css'
      - 'tests/browser-inline-home.cjs'
      - 'tests/browser-results.cjs'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'data/sample-ssd980.json'
      - 'tests/browser-smoke.cjs'
      - '.github/workflows/browser-smoke.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install browser testing dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser walkthrough
        run: |
          python3 -m http.server 8899 --bind 127.0.0.1 > /tmp/kupiora-server.log 2>&1 &
          sleep 2
          node tests/browser-smoke.cjs
          node tests/browser-results.cjs
          node tests/browser-inline-home.cjs
