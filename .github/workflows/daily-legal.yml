name: Daily official legal sources
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kupiora-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish static frontend only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Collect official legal sources
        run: python tools/update_legal.py
      - name: Save daily legal snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar/legal-feed.json radar/legal-history/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh daily official legal snapshot"
            git push origin HEAD:main
          fi
      - name: Prepare public static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html compare-any.html results.html results.js results.css inline-results.css styles.css core.js app.js catalog-loader.js sw.js manifest.webmanifest _site/
          cp -R assets data radar _site/
          cp _site/index.html _site/prices.html
          printf '%s\n' '<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Радар жизни</title><meta http-equiv="refresh" content="0;url=radar/"><script>location.replace(new URL("radar/",location.href).href)</script></head><body><a href="radar/">Открыть Радар жизни</a></body></html>' > _site/index.html
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/compare-any.html
          test -s _site/results.html
          test -s _site/results.js
          test -s _site/inline-results.css
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
